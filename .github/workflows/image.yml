name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Make room for the disposable shop integration test
        run: |
          # Only unused SDKs on this fresh GitHub-hosted runner; no shop volumes.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /

      - name: Check shell scripts
        run: |
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          shellcheck -x scripts/*.sh tests/*.sh

      - name: Test source detection without a live shop
        run: |
          php -l scripts/progress.php
          php -l scripts/anonymize-clone.php
          php -l scripts/storage-clone.php
          php -l scripts/check-rsync-error.php
          python3 tests/progress-test.py
          php -l scripts/detect-source.php
          php tests/detect-source-test.php
          php -l scripts/source-database.php
          php -l scripts/clone-database.php
          php -l scripts/migrate-clone-url.php
          php -l scripts/ensure-internal-domains.php
          php tests/clone-url-test.php
          php -l scripts/validate-copy.php
          php tests/database-config-test.php
          php -l scripts/configure-clone.php
          php tests/clone-config-test.php

      - name: Validate Coolify Compose
        env:
          SOURCE_URL: https://live.example.org
          SOURCE_SSH_HOST: hosting.example.org
          SOURCE_SSH_USER: fixture
          SOURCE_SSH_PRIVATE_KEY: fixture
          SOURCE_SHOP_PATH: /shop
          SSH_PASSWORD: fixture
          SERVICE_URL_SHOP_80: https://test.example.org
          SERVICE_FQDN_SHOP: test.example.org
          SERVICE_FQDN_SHOP_80: test.example.org
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aggrosoft/shopware-live-clone
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build locally for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image and unfinished-import guard
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="${IMAGE_TAGS%%$'\n'*}"
          docker run --rm "$image" --check-image
          docker run --rm --entrypoint php -v "$PWD:/test:ro" "$image" /test/tests/detect-source-test.php
          docker run --rm --entrypoint php -v "$PWD:/test:ro" "$image" /test/tests/database-config-test.php
          docker run --rm --entrypoint bash -v "$PWD:/test:ro" "$image" /test/tests/import-integration.sh
          status=0
          docker run --rm "$image" || status=$?
          test "$status" -eq 78
          bash tests/failure-mode.sh "$image"
          docker run --rm --entrypoint bash -v "$PWD:/test:ro" "$image" /test/tests/storage-integration.sh

      - name: Real Shopware first boot and restart
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash tests/real-shop-smoke.sh "${IMAGE_TAGS%%$'\n'*}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            if [[ -n "$image" ]]; then
              docker push "$image"
            fi
          done <<< "$IMAGE_TAGS"
