services:
  shop:
    image: ghcr.io/aggrosoft/shopware-live-clone:main
    restart: unless-stopped
    networks: [default, backend]
    environment:
      SERVICE_URL_SHOP_80: /
      SERVICE_FQDN_SHOP: null
      CLONE_URL: https://${SERVICE_FQDN_SHOP_80}
      SOURCE_URL: ${SOURCE_URL:?Set the exact live sales-channel URL}
      SOURCE_SSH_HOST: ${SOURCE_SSH_HOST:?Set SSH host}
      SOURCE_SSH_PORT: ${SOURCE_SSH_PORT:-22}
      SOURCE_SSH_USER: ${SOURCE_SSH_USER:?Set SSH user}
      SOURCE_SSH_PRIVATE_KEY: ${SOURCE_SSH_PRIVATE_KEY:?Set private key}
      SOURCE_SSH_KNOWN_HOSTS: ${SOURCE_SSH_KNOWN_HOSTS:-}
      SOURCE_SHOP_PATH: ${SOURCE_SHOP_PATH:?Set absolute project directory}
      CLONE_DATABASE_HOST: database
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      INTERNAL_STOREFRONT_ORIGIN: http://shop
      SSH_PASSWORD: ${SSH_PASSWORD:?Set SSH password}
    labels:
      - coolify.traefik.middlewares=authentik-forward-auth@file
      - sshpiper.username=${SERVICE_FQDN_SHOP}
      - sshpiper.container_username=dockware
      - sshpiper.port=22
      - sshpiper.network=${COMPOSE_PROJECT_NAME}
    volumes:
      - clone_data:/var/lib/shopware-clone
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  database:
    image: mariadb:11.4
    restart: unless-stopped
    networks: [backend]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_ROOT_HOST: '%'
    command: [mariadbd, --max-allowed-packet=1G, --innodb-flush-log-at-trx-commit=2, --skip-log-bin]
    volumes:
      - clone_db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4
    restart: unless-stopped
    networks: [backend]
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - clone_redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.4
    restart: unless-stopped
    networks: [backend]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - clone_opensearch:/usr/share/opensearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s" || exit 1']
      interval: 15s
      timeout: 5s
      retries: 30


volumes:
  clone_data:
  clone_db:
  clone_redis:
  clone_opensearch:

networks:
  default:
  backend:
    internal: true
